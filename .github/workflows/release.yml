name: Create packages on release
permissions:
  contents: read
  packages: write

on:
  release:
    types: [created]

jobs:
  create-package:
    name: Create NuGet package

    runs-on: ubuntu-latest

    env:
      NuGetFolder: ${{ github.workspace }}/nuget

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.8.x'

      - name: Determine Version
        id: version_step # step id used as a reference for output values
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        # Just build RazorLib, since Services is a class library and will be built as a dependency of RazorLib
        run: dotnet build src/ImageMapper.RazorLib --configuration Release --no-restore /p:Version=${{ steps.version_step.outputs.assemblySemVer }} /p:InformationalVersion=${{ steps.version_step.outputs.informationalVersion }}

      - name: Pack
        run: |
          dotnet pack src/ImageMapper.Services --configuration Release --no-build --output ${{ env.NuGetFolder }} /p:PackageVersion=${{ steps.version_step.outputs.fullSemVer }}
          dotnet pack src/ImageMapper.RazorLib --configuration Release --no-build --output ${{ env.NuGetFolder }} /p:PackageVersion=${{ steps.version_step.outputs.fullSemVer }}

      - name: Publish
        run: |
          dotnet nuget push ${{ env.NuGetFolder }}/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

